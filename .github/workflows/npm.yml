# Publishes `bullpane` to npm (npx bullpane) for every release tag, from the
# same commit the Docker images are built from. Needs the repository secret
# NPM_TOKEN (an npm automation token with publish rights on `bullpane`);
# without it the job skips instead of failing the release.
name: npm package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance: the package page links back to this run
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node packages/npm/build.mjs
      - run: node packages/npm/smoke.mjs
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./packages/npm/out/package.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package ${VERSION}"; exit 1; }
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping publish"; exit 0; fi
          cd packages/npm/out
          npm publish --access public --provenance
